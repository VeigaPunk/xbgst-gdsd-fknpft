# Cheap/fast default is Codex luna low+fast via sekhmet.

[lanes.grok]
provider = "xai"
model = "grok-heavy"
auth = "XAI_API_KEY"

[lanes.codex]
provider = "sekhmet"
model = "gpt-5.6-luna"
service_tier = "fast"
reasoning = "low"
auth = "codex-titanium"

[lanes.deepseek-flash]
provider = "alibaba"
model = "deepseek-v4-flash"
auth = "ALIBABA_API_KEY"
base_url_env = "ALIBABA_BASE_URL"

[lanes.kimi]
provider = "moonshot"
model = "kimi"
auth = "KIMI_API_KEY"
oauth_token_path_env = "KIMI_OAUTH_TOKEN_PATH"

[roles]
judge = "grok"
the-planner = "grok"
scout = "grok"
reviewer = "grok"
labrat = "codex"
executor = "codex"
connector = "grok"
distiller = "codex"
simplifier = "grok"
the-revenger = "grok"
sentinel = "grok"
critic = "grok"
mutation-tester = "codex"
scribe = "codex"
the-architect = "grok"
the-janitor = "grok"
the-musketeer = "grok"

[spawn]
method = "fnm-multishell"
node = "default"
fallback = "env-i"
